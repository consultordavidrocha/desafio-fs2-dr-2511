apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-comunicacoes
  namespace: comunicacoes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-comunicacoes
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
