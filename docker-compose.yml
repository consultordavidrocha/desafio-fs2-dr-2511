# Sobe o banco e a API com os dados carregados.
# Uso: docker compose up -d --build
#   API:     http://localhost:8888  (Swagger em /docs)
#   Postgres: localhost:5434
services:
  db:
    image: postgres:16-alpine
    container_name: juscash-db
    environment:
      POSTGRES_USER: juscash
      POSTGRES_PASSWORD: juscash
      POSTGRES_DB: juscash
    ports:
      # Porta do host configurável (padrão 5434) para não conflitar com outro Postgres local.
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Cria o banco usado pelos testes e2e (só roda na primeira inicialização).
      - ./api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juscash -d juscash"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: juscash-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://juscash:juscash@db:5432/juscash?schema=public
      # Segredo só para rodar localmente; em produção vem do ambiente de deploy.
      JWT_SECRET: ${JWT_SECRET:-segredo-local-do-docker-compose-nao-usar-em-producao}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3099}
      PORT: 8888
      SEED_DATA_DIR: /app/dados
    ports:
      - "${API_HOST_PORT:-8888}:8888"
    volumes:
      # Dados do case (comunicacoes.json, tribunais.json) lidos pelo seed.
      - ./dados:/app/dados:ro

volumes:
  db-data:
